<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="Consolas, Menlo, monospace">
  <!-- wildcat-calendar — a render of the production UI, drawn by hand -->
  <rect width="880" height="460" fill="#141210"/>
  <!-- title bar -->
  <rect width="880" height="42" fill="#1c1915"/>
  <circle cx="24" cy="21" r="5" fill="#ff5f57"/>
  <circle cx="44" cy="21" r="5" fill="#febc2e"/>
  <circle cx="64" cy="21" r="5" fill="#28c840"/>
  <text x="92" y="26" font-size="13" fill="#8a8178">wildcat-calendar — bcss-calendar.vercel.app</text>
  <text x="726" y="26" font-size="12" fill="#9ece6a">● live — sse connected</text>
  <!-- toolbar -->
  <text x="28" y="76" font-size="20" font-weight="bold" fill="#e8e2d8">october</text>
  <g font-size="11" fill="#8a8178">
    <rect x="640" y="58" width="52" height="22" rx="3" fill="#26221c"/><text x="654" y="73">month</text>
    <rect x="698" y="58" width="52" height="22" rx="3" fill="#1c1915"/><text x="712" y="73">week</text>
    <rect x="756" y="58" width="44" height="22" rx="3" fill="#1c1915"/><text x="770" y="73">day</text>
    <rect x="806" y="58" width="56" height="22" rx="3" fill="#1c1915"/><text x="816" y="73">agenda</text>
  </g>
  <!-- weekday header -->
  <g font-size="10" fill="#5f564a" letter-spacing="1">
    <text x="34" y="106">MON</text><text x="152" y="106">TUE</text><text x="270" y="106">WED</text>
    <text x="386" y="106">THU</text><text x="504" y="106">FRI</text><text x="622" y="106">SAT</text><text x="740" y="106">SUN</text>
  </g>
  <!-- grid: 7 cols x 4 rows -->
  <g stroke="#2a2620" stroke-width="1">
    <rect x="28" y="116" width="110" height="72" fill="none"/><rect x="140" y="116" width="110" height="72" fill="none"/><rect x="252" y="116" width="110" height="72" fill="none"/><rect x="364" y="116" width="110" height="72" fill="none"/><rect x="476" y="116" width="110" height="72" fill="none"/><rect x="588" y="116" width="110" height="72" fill="none"/><rect x="700" y="116" width="110" height="72" fill="none"/>
    <rect x="28" y="188" width="110" height="72" fill="none"/><rect x="140" y="188" width="110" height="72" fill="none"/><rect x="252" y="188" width="110" height="72" fill="none"/><rect x="364" y="188" width="110" height="72" fill="none"/><rect x="476" y="188" width="110" height="72" fill="none"/><rect x="588" y="188" width="110" height="72" fill="none"/><rect x="700" y="188" width="110" height="72" fill="none"/>
    <rect x="28" y="260" width="110" height="72" fill="none"/><rect x="140" y="260" width="110" height="72" fill="none"/><rect x="252" y="260" width="110" height="72" fill="none"/><rect x="364" y="260" width="110" height="72" fill="none"/><rect x="476" y="260" width="110" height="72" fill="none"/><rect x="588" y="260" width="110" height="72" fill="none"/><rect x="700" y="260" width="110" height="72" fill="none"/>
    <rect x="28" y="332" width="110" height="72" fill="none"/><rect x="140" y="332" width="110" height="72" fill="none"/><rect x="252" y="332" width="110" height="72" fill="none"/><rect x="364" y="332" width="110" height="72" fill="none"/><rect x="476" y="332" width="110" height="72" fill="none"/><rect x="588" y="332" width="110" height="72" fill="none"/><rect x="700" y="332" width="110" height="72" fill="none"/>
  </g>
  <!-- day numbers -->
  <g font-size="11" fill="#8a8178">
    <text x="36" y="132">1</text><text x="148" y="132">2</text><text x="260" y="132">3</text><text x="372" y="132">4</text><text x="484" y="132">5</text><text x="596" y="132">6</text><text x="708" y="132">7</text>
    <text x="36" y="204">8</text><text x="148" y="204">9</text><text x="260" y="204">10</text><text x="372" y="204">11</text><text x="484" y="204">12</text><text x="596" y="204">13</text><text x="708" y="204">14</text>
    <text x="36" y="276">15</text><text x="148" y="276">16</text><text x="260" y="276">17</text><text x="372" y="276">18</text><text x="484" y="276">19</text><text x="596" y="276">20</text><text x="708" y="276">21</text>
    <text x="36" y="348">22</text><text x="148" y="348">23</text><text x="260" y="348">24</text><text x="372" y="348">25</text><text x="484" y="348">26</text><text x="596" y="348">27</text><text x="708" y="348">28</text>
  </g>
  <!-- events -->
  <g font-size="9.5">
    <rect x="146" y="196" width="102" height="16" rx="3" fill="#b25e10"/><text x="152" y="207" fill="#fdfaf4">club fair — gym</text>
    <rect x="370" y="268" width="102" height="16" rx="3" fill="#3d6e80"/><text x="376" y="279" fill="#fdfaf4">debate — rm 204</text>
    <rect x="482" y="340" width="102" height="16" rx="3" fill="#4a7a46"/><text x="488" y="351" fill="#fdfaf4">chess — library</text>
    <rect x="258" y="124" width="102" height="16" rx="3" fill="#6a4a9e"/><text x="264" y="135" fill="#fdfaf4">spirit week</text>
    <rect x="594" y="124" width="102" height="16" rx="3" fill="#6a4a9e"/><text x="600" y="135" fill="#fdfaf4">spirit week</text>
    <rect x="34" y="340" width="102" height="16" rx="3" fill="#b25e10"/><text x="40" y="351" fill="#fdfaf4">pep rally 12:00</text>
    <rect x="706" y="196" width="102" height="16" rx="3" fill="#3d6e80"/><text x="712" y="207" fill="#fdfaf4">cleanup — shore</text>
  </g>
  <!-- status bar -->
  <rect y="424" width="880" height="36" fill="#1c1915"/>
  <text x="28" y="447" font-size="11" fill="#8a8178">$ uptime --school</text>
  <text x="28" y="447" font-size="11" fill="#5f564a" dx="150"></text>
  <text x="160" y="447" font-size="11" fill="#9ece6a">1,500+ users · sub-100ms · since feb 2026</text>
  <text x="652" y="447" font-size="11" fill="#5f564a">built by a student. used by the school.</text>
</svg>
